name: Goldbach catalogue
on:
  workflow_dispatch:
  pull_request:
    paths:
      - deploy/publish_catalogue.py
      - deploy/test_publish_catalogue.py
      - research/check-statement-scope.lean
      - research/strong-goldbach.lean
      - research/ROADMAP.md
      - 'research/problems/**'
      - research/build_catalogue.py
      - research/test_route_sources.py
      - research/gaps.json
      - research/problems.json
      - .github/workflows/catalogue.yml
  push:
    branches: [main]
    paths:
      - deploy/publish_catalogue.py
      - deploy/test_publish_catalogue.py
      - research/check-statement-scope.lean
      - research/strong-goldbach.lean
      - research/ROADMAP.md
      - 'research/problems/**'
      - research/build_catalogue.py
      - research/test_route_sources.py
      - research/gaps.json
      - research/problems.json
      - research/test_catalogue.py
      - deploy/landau.py
      - deploy/test_landau.py
      - lean/lean-toolchain
      - lean/lake-manifest.json
      - .github/workflows/catalogue.yml
permissions:
  contents: read
jobs:
  statements:
    if: github.repository == 'CGandGameEngineLearner/goldbach-proofs'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -B research/build_catalogue.py
      - run: python3 -B -m unittest research.test_route_sources research.test_catalogue deploy.test_landau deploy.test_publish_catalogue -v
      - name: Install pinned Lean and Mathlib
        working-directory: lean
        run: |
          set -euo pipefail
          curl --retry 4 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --no-modify-path --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get
      - name: Elaborate every published proposition
        working-directory: lean
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          gaps = json.loads(Path("../research/gaps.json").read_text())["gaps"]
          problems = json.loads(Path("../research/problems.json").read_text())
          gaps.extend(gap for problem in problems.values() for gap in problem['gaps'])
          # All current gaps are independent and can be stated using Mathlib alone.
          assert all(not gap["imports"] for gap in gaps)
          endpoint = next(g["statement"] for g in gaps if g["id"] == "L-goldbach-binary-pointwise-positivity")
          lines = [Path("../research/strong-goldbach.lean").read_text(),
                   Path("../research/check-statement-scope.lean").read_text(),
                   f"example : StrongGoldbach ↔ ({endpoint}) := strongGoldbach_iff_primeMass",
                   "set_option autoImplicit false"]
          for gap in gaps:
              lines.extend(("", "-- " + gap["id"], "#check_statement_scope (" + gap["statement"] + ")", "example : Prop := (" + gap["statement"] + ")"))
          (Path(os.environ["RUNNER_TEMP"]) / "Catalogue.lean").write_text("\n".join(lines) + "\n")
          print(f"Type-checking {len(gaps)} propositions")
          PY
          "$HOME/.elan/bin/lake" env lean "$RUNNER_TEMP/Catalogue.lean"

  verify:
    strategy:
      fail-fast: false
      matrix:
        pr: [2508, 2516]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain and library
        working-directory: lean
        run: |
          curl --retry 4 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          "$HOME/.elan/bin/lake" exe cache get
      - name: Check pinned contributor file
        run: |
          set -eu
          export PATH="$HOME/.elan/bin:$PATH"
          git fetch --quiet https://github.com/CGandGameEngineLearner/goldbach-proofs.git refs/pull/${{ matrix.pr }}/head
          if [ "${{ matrix.pr }}" = 2516 ]; then
            test "$(git rev-parse FETCH_HEAD)" = 2de444a7a8687852832ce79b91533f068a90d77b
            git show FETCH_HEAD:research/problems/goldbach/routes/representations/fixed-ap.lean > "$RUNNER_TEMP/FixedAP.lean"
            cd lean
            lake env lean "$RUNNER_TEMP/FixedAP.lean"
          else
            test "$(git rev-parse FETCH_HEAD)" = b39beca122223bc495f3ec465e534f71f74c4863
            f=lean/PEqualNP/Outside/FourthMomentRefutation.lean
            git show FETCH_HEAD:research/disproofs/DeepFourthMomentDisproof.lean > "$f"
            python - <<'PY'
            import json
            from pathlib import Path
            g=next(g for g in json.loads(Path("research/gaps.json").read_bytes())["gaps"] if g["id"]=="L-goldbach-frontier-deep-fourth-moment-conjecture")
            Path("/tmp/recorded-proposition").write_text(g["statement"])
            with Path("lean/PEqualNP/Outside/FourthMomentRefutation.lean").open("a") as f:
                f.write("\ntheorem PEqualNP.Outside.FourthMomentRefutation : ¬ (" + g["statement"] + ") := L_goldbach_frontier_deep_fourth_moment_conjecture_is_false\n")
            PY
            node tools/check-lean.mjs "$f" /tmp/recorded-proposition refute
          fi
